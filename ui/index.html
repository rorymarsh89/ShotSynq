<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShotSynq</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Titlebar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <img class="app-icon app-logo" src="logo.svg" alt="">
        <span class="app-title">ShotSynq</span>
      </div>
      <div class="actions">
        <button class="btn" id="btn-add">+ Add media</button>
        <button class="btn btn-sync" id="btn-sync" disabled>&#x21BB; Synchronise</button>
        <button class="btn btn-cancel"      id="btn-cancel" style="display:none">&#x2715; Cancel</button>
        <button class="btn btn-export" id="btn-export" disabled>&#x2191; Export</button>
        <button class="btn btn-clear"       id="btn-clear" style="display:none">Clear all</button>
      </div>
    </div>

    <!-- Body -->
    <div class="body">

      <!-- Sidebar -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-head">Media</div>
        <div id="sidebar-tracks"></div>
        <div class="about">
          <span id="about-version">ShotSynq</span>
          <button type="button" class="about-link" id="btn-licences">Licences</button>
        </div>
      </div>

      <!-- Timeline -->
      <div class="timeline">
        <div class="ruler-wrap">
          <canvas id="ruler"></canvas>
        </div>
        <div class="tracks-scroll" id="tracks-scroll">
          <div class="tracks-inner" id="tracks-inner">
            <div id="drop-hint" class="drop-hint">
              <button type="button" class="drop-target" id="drop-target">
                <span class="drop-plus">+</span>
                <span>Drop media files here &mdash; or click to add</span>
              </button>
            </div>
          </div>
        </div>
        <div class="zoombar" id="zoombar">
          <div class="zoombar-handle" id="zoombar-handle">
            <div class="zoombar-grip zoombar-grip-l" id="zoombar-grip-l"></div>
            <div class="zoombar-grip zoombar-grip-r" id="zoombar-grip-r"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Status bar -->
    <div class="statusbar">
      <div id="status-dot" class="status-dot" style="display:none"></div>
      <div id="status-chips" class="status-chips" style="display:none"></div>
      <span id="status-text" class="status-text">Add media files to get started</span>
      <span class="zoom-hint" id="zoom-hint">Alt+scroll to zoom &nbsp;&middot;&nbsp; scroll to pan &nbsp;&middot;&nbsp; drag handle ends to resize view</span>
      <span class="footer-stats" id="footer-stats" style="display:none"
            title="Alt+scroll to zoom · scroll to pan · drag handle ends to resize view"></span>
    </div>

  </div>

  <!-- Clip right-click menu -->
  <div id="ctx-menu" class="ctx-menu" style="display:none">
    <button type="button" data-action="open-clip">Open clip</button>
    <button type="button" data-action="reveal-clip">Show in File Explorer</button>
    <div class="ctx-sep"></div>
    <button type="button" data-action="remove-clip">Remove clip</button>
    <button type="button" data-action="remove-unsynced">Remove all unsynced clips</button>
  </div>

  <!-- Export dialog -->
  <div class="modal-overlay" id="export-dialog" style="display:none">
    <div class="modal export-modal" role="dialog" aria-labelledby="export-title">
      <div class="modal-title" id="export-title">Export timeline</div>
      <div class="modal-sub">Editor</div>
      <div class="editor-cards">
        <button type="button" class="editor-card" data-fmt="premiere"><span class="ec-name">Premiere Pro</span><span class="ec-file">XML</span></button>
        <button type="button" class="editor-card" data-fmt="resolve"><span class="ec-name">DaVinci Resolve</span><span class="ec-file">XML</span></button>
        <button type="button" class="editor-card" data-fmt="fcpxml"><span class="ec-name">Final Cut Pro</span><span class="ec-file">FCPXML</span></button>
      </div>
      <div class="modal-sub">Options</div>
      <label class="opt-row"><input type="checkbox" id="opt-strip-audio">
        <span><span class="opt-name">Remove camera audio</span><span class="opt-help">Only where a recorder covers the clip. Camera audio stays where no recorder was running.</span></span></label>
      <label class="opt-row"><input type="checkbox" id="opt-drop-unsynced">
        <span><span class="opt-name">Remove unsynced clips</span><span class="opt-help">Otherwise they go on their own tracks at the end of the timeline.</span></span></label>
      <div class="modal-actions">
        <button type="button" class="btn" id="export-cancel">Cancel</button>
        <button type="button" class="btn btn-export next" id="export-go">&#x2191; Export</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
