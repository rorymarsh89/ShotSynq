[package]
name = "shotsynq"
version = "0.9.0"
description = "ShotSynq: sync multicam video and audio into an editable timeline"
authors = ["Rory Marshall"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
shotsynq-core = { path = "../crates/shotsynq-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
